<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card - Redes Sociais</title>

    <!-- Link para folha de estilos -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="style-body">
    <div class="container">
        <img src="./images/photo.png" alt="Foto de perfil do usuário" class="icon">
        <h1>Valéria Muniz</h1>
        <h2>São Paulo, Brasil</h2>
        <p><b>Front-End Senior and avid reader</b></p>
        
        <!-- Lista de redes sociais -->
        <!-- ol = Lista enumerada -->
        <!-- ul = Lista não enumeradas -->
        
        <ol>
            <li><a href="https://github.com" target="_blank"><b>GitHub</b></a></li>
            <li><a href="https://dribbble.com" target="_blank"><b>Dribble</b></a></li>
            <li><a href="https://linkedin.com" target="_blank"><b>LinkedIn</b></a></li>
            <li><a href="https://instagram.com" target="_blank"><b>Instagram</b></a></li>
            <li><a href="https://x.com" target="_blank"><b>X</b></a></li>
        </ol>
    </div>
</body>
</html>
